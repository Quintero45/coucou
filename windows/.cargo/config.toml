# sherpa-onnx's prebuilt static libraries (voice/, "Hey ARIA") are built with
# the static C runtime and use ETW and the registry from advapi32.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=advapi32.lib"]

# bindgen (sherpa-rs-sys) needs libclang; winget install LLVM.LLVM puts it here.
[env]
LIBCLANG_PATH = { value = "C:\\Program Files\\LLVM\\bin", force = false }
