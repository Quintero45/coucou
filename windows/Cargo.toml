[workspace]
members = ["src-tauri", "hook"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

# Release profile shared by the app and the hook relay: the hook must start fast
# (Claude Code spawns it on every event), so we optimise for size and speed.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# sherpa-rs-sys's build script links the debug C runtime (msvcrtd) whenever it
# is itself built with debug assertions, which mixes two heaps in dev builds
# and tests (voice/). Build scripts never need them.
[profile.dev.build-override]
debug-assertions = false
